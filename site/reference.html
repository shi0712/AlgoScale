<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AlgoScale reference solution viewer" />
    <title>Reference · AlgoScale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css" />
    <link rel="stylesheet" href="./reference.css" />
  </head>
  <body>
    <header class="reference-nav">
      <a class="brand" href="./"><span class="brand-mark">A²</span><span>AlgoScale</span></a>
      <a class="back-link" href="./#catalog">← Problem catalog</a>
    </header>
    <main>
      <section class="reference-head">
        <p class="eyebrow" id="asset-label">Reference artifact</p>
        <div class="heading-row">
          <div><p class="problem-number" id="problem-number">Loading…</p><h1 id="problem-title">Reference</h1></div>
          <div class="actions">
            <button id="copy" type="button">Copy</button>
            <a id="raw" href="#">View raw ↗</a>
          </div>
        </div>
      </section>
      <article id="content" class="document" aria-live="polite"><p class="loading">Loading reference artifact…</p></article>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/cpp.min.js"></script>
    <script src="./reference.js"></script>
  </body>
</html>
