<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Submitted C++ source for an AlgoScale Interactive evaluation." />
    <meta name="theme-color" content="#171816" />
    <title>Interactive submission source · AlgoScale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css" />
    <link rel="stylesheet" href="./interactive-code.css?v=20261123-token-usage" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./"><span class="brand-mark">A²</span><span>AlgoScale</span></a>
      <a id="back-link" href="./#catalog">Back to interactive results</a>
    </header>
    <main>
      <section class="source-head">
        <div>
          <p class="eyebrow" id="problem-label">Interactive submission</p>
          <h1 id="problem-title">Loading source…</h1>
        </div>
        <div class="submission-summary">
          <span id="mode"></span>
          <strong id="model">—</strong>
          <span id="harness"></span>
          <span id="submission-id"></span>
        </div>
      </section>
      <dl id="submission-usage" class="submission-usage" aria-label="Submission usage"></dl>
      <section id="error" class="message error" hidden></section>
      <section id="source-panel" class="source-panel" hidden>
        <div class="source-toolbar">
          <span id="source-status">Loading…</span>
          <div><button id="copy" type="button">Copy</button><a id="raw" href="#" target="_blank" rel="noreferrer">Raw ↗</a></div>
        </div>
        <pre><code id="code" class="language-cpp"></code></pre>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/cpp.min.js" defer></script>
    <script src="./interactive-code.js?v=20261123-token-usage" defer></script>
  </body>
</html>
